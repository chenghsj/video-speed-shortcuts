name: Build store releases

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.browser }} package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "$TAG_VERSION" = "v$package_version"

      - name: Test and typecheck
        run: |
          npm test
          npm run typecheck

      - name: Build extension
        run: npm run build:${{ matrix.browser }}

      - name: Validate browser manifest
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          manifest="dist/$BROWSER/manifest.json"
          test "$(jq -r .version "$manifest")" = "$(node -p "require('./package.json').version")"
          if [ "$BROWSER" = firefox ]; then
            jq -e '.background.scripts and .browser_specific_settings.gecko.id and (.browser_specific_settings.gecko.data_collection_permissions.required == ["none"])' "$manifest"
          else
            jq -e '.background.service_worker and (.browser_specific_settings == null)' "$manifest"
          fi

      - name: Lint Firefox store package
        if: matrix.browser == 'firefox'
        run: npx --yes web-ext@10.6.0 lint --source-dir dist/firefox --output text

      - name: Package extension
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p release
          (cd "dist/$BROWSER" && zip -r "../../release/video-speed-shortcuts-$version-$BROWSER.zip" .)
          if [ "$BROWSER" = firefox ]; then
            zip -r "release/video-speed-shortcuts-$version-firefox-source.zip" \
              src public package.json package-lock.json tsconfig.json vite.config.ts \
              manifest.config.ts popup.html options.html README.md PRIVACY.md CONTEXT.md \
              LICENSE CONTRIBUTING.md SECURITY.md
          fi

      - name: Upload store package
        uses: actions/upload-artifact@v4
        with:
          name: video-speed-shortcuts-${{ matrix.browser }}
          path: release/*.zip
          if-no-files-found: error
          retention-days: 30

  checksums:
    name: Generate SHA-256 checksums
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download store packages
        uses: actions/download-artifact@v4
        with:
          pattern: video-speed-shortcuts-*
          path: release
          merge-multiple: true

      - name: Generate checksums
        working-directory: release
        run: sha256sum *.zip > SHA256SUMS

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: video-speed-shortcuts-checksums
          path: release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: checksums
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          pattern: video-speed-shortcuts-*
          path: release
          merge-multiple: true

      - name: Create release and attach packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail

          notes_file=".github/release-notes/$TAG_VERSION.md"
          if [[ ! -s "$notes_file" ]]; then
            printf 'Missing release notes: %s\n' "$notes_file" >&2
            exit 1
          fi

          if gh release view "$TAG_VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$TAG_VERSION" --repo "$GITHUB_REPOSITORY" --notes-file "$notes_file"
            gh release upload "$TAG_VERSION" release/*.zip release/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG_VERSION" release/*.zip release/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file "$notes_file" \
              --verify-tag
          fi
